name: CMake (compile and test)

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  build-only:
    runs-on: ${{ matrix.os }}
    env:
      path-separator: ${{ (startsWith(matrix.os, 'windows') && '\') || '/' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, macos-15-intel, macos-15]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}${{ env.path-separator }}build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (Ubuntu only)
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: |
        sudo apt update
        sudo apt install libfuse2 libudev-dev libssl-dev ninja-build gcc lcov wget libxcb1 libxcb-cursor0 libxcb-xinerama0 libxcb-xfixes0 libxcb-image0
        LINUXDEPLOYQT_ARCH=$(uname -m)
        wget -c https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-$LINUXDEPLOYQT_ARCH.AppImage
        chmod +x linuxdeployqt-continuous-$LINUXDEPLOYQT_ARCH.AppImage

    - name: Install dependencies (MacOS only)
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: |
        brew install lcov

    - name: Install Inno Setup (Windows only)
      if: ${{ startsWith(matrix.os, 'windows') }}
      shell: pwsh
      run: choco install innosetup --yes --no-progress

    - name: Install Qt6 dependencies
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ (matrix.os == 'ubuntu-22.04' && '6.2.*') || '6.8.*' }}
        tools: 'tools_ninja tools_cmake'

    - name: Run Python build script
      run: python -m Build

    - name: Run tests
      run: |
        ctest --output-on-failure --test-dir ${{ steps.strings.outputs.build-output-dir }}
